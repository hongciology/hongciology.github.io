        --ink: #191919;

        --container: 1500px;

        --serif: 'EB Garamond', Georgia, serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        background: var(--bg);
        color: var(--ink);

        padding: 22px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
    }

    .wordmark {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        text-decoration: none;
        border-bottom: none;
        padding-bottom: 0;
    }

    .nav {
        display: flex;
        gap: 32px;
    }

    .nav a {
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;

    }

    .nav a:hover,
    .nav a:focus-visible {

    }

        font-weight: 700;

        text-transform: uppercase;

        margin-top: 48px;
        margin-bottom: 18px;
        padding-bottom: 10px;

    section:first-of-type h2 {

    p {

    section p:last-child {

    a:hover,

        border-color: var(--ink);
    }

    .entry {
        margin-bottom: 16px;
    }

    .entry:last-child {
        margin-bottom: 0;
    }

        color: var(--grey);
        margin-bottom: 14px;
    }
