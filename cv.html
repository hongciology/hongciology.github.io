<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Yeeun Hong</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700&family=Open+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            color: #000;
            background: #ffffff;
            line-height: 1.6;
            font-size: 17px;
        }

        /* Navigation */
        nav {
            border-bottom: 1px solid #e0e0e0;
            padding: 28px 0;
            margin-bottom: 50px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        nav .logo {
            font-family: 'League Spartan', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #000;
        }

        nav .logo-link {
            color: #000;
            text-decoration: none;
            font-family: 'League Spartan', sans-serif;
            font-size: 18px;
            font-weight: 400;
        }

        nav .logo-link:hover {
            color: #000;
        }

        nav .nav-links {
            display: flex;
            gap: 45px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            letter-spacing: 0.03em;
            font-family: 'Open Sans', sans-serif;
        }

        nav a:hover {
            color: #000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 80px 40px;
        }

        .header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-family: 'League Spartan', sans-serif;
            font-size: 42px;
            font-weight: 400;
            color: #000;
            margin-bottom: 30px;
            position: relative;
        }

        .title-section {
            margin-bottom: 0px;
        }

        .brush-underline {
            display: none;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #333;
            color: #fff;
        }

        @keyframes fadeInUnderline {
            from {
                opacity: 0;
                transform: scaleX(0);
                transform-origin: left;
            }
            to {
                opacity: 0.7;
                transform: scaleX(1);
            }
        }

        section {
            margin-bottom: 30px;
            font-family: 'Open Sans', sans-serif;
        }

        /* Contact Info */
        .contact-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-family: 'Open Sans', sans-serif;
        }

        .contact-item {
            margin-bottom: 15px;
            font-family: 'Open Sans', sans-serif;
        }

        .contact-label {
            font-weight: 700;
            font-size: 14px;
            color: #666;
            font-family: 'Open Sans', sans-serif;
        }

        .contact-link {
            color: #000;
            text-decoration: none;
            word-break: break-word;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

        .connect-label {
            font-weight: 700;
            font-size: 14px;
            color: #666;
            font-family: 'Open Sans', sans-serif;
            display: block;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .connect-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .connect-link {
            color: #000;
            text-decoration: none;
            font-size: 14px;
            font-family: 'Open Sans', sans-serif;
            transition: color 0.3s ease;
        }

        .connect-link:hover {
            color: #666;
            text-decoration: underline;
        }

        .pdf-container {
            width: 100%;
            height: auto;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            overflow: auto;
            background: #f9f9f9;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 900px;
            border: none;
            display: block;
        }

        .mobile-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .mobile-message p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .mobile-message .download-btn {
            margin-top: 10px;
        }

        @media (max-width: 900px) {
            nav ul {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 0 20px;
            }

            nav .logo-link {
                font-size: 32px;
                font-weight: 600;
            }

            nav .logo {
                font-size: 32px;
                font-weight: 600;
            }

            nav .nav-links {
                flex-direction: row;
                gap: 20px;
                margin-top: 10px;
            }

            .container {
                padding: 0 20px 80px 20px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            h1 {
                font-size: 32px;
            }

            iframe {
                height: 700px;
            }
        }

        @media (max-width: 600px) {
            nav {
                padding: 20px 0;
                margin-bottom: 30px;
            }

            nav ul {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 0 15px;
            }

            nav .logo-link {
                font-size: 28px;
                font-weight: 600;
            }

            nav .logo {
                font-size: 28px;
                font-weight: 600;
            }

            nav .nav-links {
                flex-direction: row;
                gap: 15px;
                font-size: 12px;
                margin-top: 10px;
            }

            nav a {
                font-size: 12px;
            }

            .container {
                padding: 0 15px 80px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .pdf-container {
                min-height: auto;
            }

            iframe {
                height: calc((100vw - 30px) * 1.414);
            }

            .mobile-message {
                display: none;
            }
        }
    </style>
</head>

<body>

<nav>
    <ul>
        <li class="logo"><a href="index.html" class="logo-link"><strong>YEEUN HONG</strong></a></li>
        <li class="nav-links">

            <a href="research.html">Research</a>
            <a href="cv.html">CV</a>
        </li>
    </ul>
</nav>

<div class="container">
    <div class="header">
        <div>
            <h1>Curriculum Vitae</h1>
            <svg class="brush-underline" viewBox="0 0 400 40" preserveAspectRatio="none">
                <path d="M 0 25 Q 100 10, 200 20 T 400 18" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <a href="YGHCV.pdf" class="download-btn" download>Download PDF</a>
    </div>
    <div class="pdf-container">
        <iframe src="https://docs.google.com/viewer?url=https://hongciology.github.io/YGHCV.pdf&embedded=true"></iframe>
        <div class="mobile-message">
            <p>On mobile devices, tap below to view the PDF in full screen.</p>
            <a href="YGHCV.pdf" class="download-btn" target="_blank">View CV</a>
            <br><br>
            <p style="font-size: 12px; color: #999;">Or <a href="YGHCV.pdf" download style="color: #000; text-decoration: underline;">download PDF</a></p>
        </div>
    </div>

    <section>
        <div class="contact-info">
            <div class="contact-item">
                <span class="contact-label">Contact</span><br>
                <a href="mailto:yhong4@albany.edu" class="contact-link">yhong4@albany.edu</a>
            </div>
            <div>
                <span class="connect-label">Connect</span>
                <div class="connect-links">
                    <a href="https://www.researchgate.net/profile/Yeeun-Hong-4?ev=hdr_xprf" target="_blank" class="connect-link">ResearchGate</a>
                    <a href="https://www.linkedin.com/in/yeeun-hong-334b161b5/" target="_blank" class="connect-link">LinkedIn</a>
                    <a href="https://bsky.app/profile/hongciology.bsky.social" target="_blank" class="connect-link">Bluesky</a>
                    <a href="https://x.com/hongciology" target="_blank" class="connect-link">X</a>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
