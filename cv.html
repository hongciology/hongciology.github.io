<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Yeeun Hong</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #ffffff;
        --ink: #191919;
        --grey: #6c6c6c;
        --line: #e5e5e5;

        /* Shared width for header and content */
        --container: 1500px;

        --serif: 'EB Garamond', Georgia, serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--serif);
        font-size: 21px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    a {
        color: inherit;
    }

    /* ---------- Header ---------- */

    .topbar {
        border-bottom: 1px solid var(--line);
    }

    .topbar .inner {
        max-width: var(--container);
        margin: 0 auto;
        padding: 22px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
    }

    .wordmark {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
        text-decoration: none;
    }

    .nav {
        display: flex;
        gap: 32px;
    }

    .nav a {
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--grey);
        text-decoration: none;
        transition: color .18s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
        color: var(--ink);
    }

    /* ---------- Main ---------- */

    main {
        flex: 1;
    }

    .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 64px 40px 120px;
    }

    h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(2.2rem, 4vw, 3rem);
        margin-bottom: 36px;
    }

    a {
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 1px;
        transition: border-color .18s ease;
    }

    a:hover,
    a:focus-visible {
        border-color: var(--ink);
    }

    a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
    }

    /* Download button */

    .download-btn {
        display: inline-block;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--ink);
        text-decoration: none;
        border: 1px solid var(--ink);
        padding: 12px 22px;
        border-radius: 3px;
        margin-bottom: 40px;
        transition: background-color .18s ease, color .18s ease;
    }

    .download-btn:hover,
    .download-btn:focus-visible {
        background: var(--bg);
        color: var(--ink);
    }

    /* PDF viewer */

    .pdf-viewer-container {
        width: 100%;
        background: #fafafa;
        border: 1px solid var(--line);
        overflow: hidden;
        margin-bottom: 56px;
    }

    .pdf-embed {
        width: 100%;
        height: 1100px;
        border: none;
        display: block;
        background: var(--bg);
    }

    .fallback-message {
        display: none;
        text-align: center;
        padding: 60px 40px;
        background: #f9f9f9;
    }

    .fallback-message p {
        color: var(--grey);
        margin-bottom: 20px;
        font-size: 16px;
        font-family: var(--sans);
    }

    /* Contact */

    .contact {
        margin-top: 56px;
        padding-top: 32px;
        border-top: 1px solid var(--line);
    }

    .label {
        display: block;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--grey);
        margin-bottom: 14px;
    }

    .label.more {
        margin-top: 30px;
    }

    .email {
        font-size: 16px;
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 2px;
    }

    .email:hover,
    .email:focus-visible {
        border-color: var(--ink);
    }

    .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
        margin-top: 20px;
    }

    .links a {
        font-size: 16px;
        text-decoration: none;
        border-bottom: 1px solid var(--line);
        padding-bottom: 1px;
        transition: border-color .18s ease;
    }

    .links a:hover,
    .links a:focus-visible {
        border-color: var(--ink);
    }

    /* ---------- Mobile ---------- */

    @media (max-width: 820px) {

        .topbar .inner {
            padding: 18px 26px;
        }

        .nav {
            gap: 22px;
        }

        .container {
            padding: 44px 26px 80px;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 2.6rem);
        }

        .pdf-embed {
            height: 700px;
        }

        .fallback-message {
            padding: 40px 20px;
        }

        .fallback-message p {
            font-size: 14px;
        }
    }

</style>
</head>

<body>

<header class="topbar">
    <div class="inner">
        <a href="index.html" class="wordmark">Yeeun Hong</a>

        <nav class="nav" aria-label="Primary">
            <a href="research.html">Research</a>
            <a href="cv.html">CV</a>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <h1>Curriculum Vitae</h1>

        <a href="https://hongciology.github.io/YGHCV.pdf" class="download-btn" download target="_blank">Download PDF</a>

        <div class="pdf-viewer-container">
            <embed
                src="https://hongciology.github.io/YGHCV.pdf#toolbar=0&navpanes=0&scrollbar=1"
                type="application/pdf"
                class="pdf-embed"
            />
            <div class="fallback-message">
                <p>Unable to display PDF. Please download it to view.</p>
                <a href="https://hongciology.github.io/YGHCV.pdf" class="download-btn" download target="_blank">Download PDF</a>
            </div>
        </div>

        <div class="contact">
            <span class="label">Questions?</span>
            <a class="email" href="mailto:yhong4@albany.edu">yhong4@albany.edu</a>
            <span class="label more">Say hi elsewhere</span>
            <div class="links">
                <a href="https://www.researchgate.net/profile/Yeeun-Hong-4" target="_blank" rel="noopener">ResearchGate</a>
                <a href="https://www.linkedin.com/in/yeeun-hong-334b161b5/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://bsky.app/profile/hongciology.bsky.social" target="_blank" rel="noopener">Bluesky</a>
                <a href="https://x.com/hongciology" target="_blank" rel="noopener">X</a>
            </div>
        </div>
    </div>
</main>

<script>
    // Fallback for browsers that don't support PDF embedding
    document.addEventListener('DOMContentLoaded', function() {
        const embed = document.querySelector('.pdf-embed');
        const fallback = document.querySelector('.fallback-message');

        setTimeout(function() {
            if (embed.offsetHeight === 0) {
                fallback.style.display = 'block';
                embed.style.display = 'none';
            }
        }, 1000);
    });
</script>

</body>
</html>
